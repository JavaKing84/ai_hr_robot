            - field: education_level
              operator: gte
              value: 本科
              label: 学历本科及以上
            - field: years_experience
              operator: gte
              value: 2
              label: 2 年以上产品经验
          weighted:
            - field: skills
              operator: contains_any
              weight: 45
              value: [需求分析, 竞品分析, PRD, 数据分析, 用户研究, Axure, SQL, 版本规划]
              label: 产品技能匹配度
            - field: project_highlights
              operator: contains_any
              weight: 25
              value: [0 到 1, 0到1, B 端, B端, G 端, G端, 增长, 商业化, 中台]
              label: 项目经历相关度
            - field: major
              operator: contains_any
              weight: 15
              value: [市场, 管理, 经济, 计算机, 新闻, 心理, 信息]
              label: 专业相关性
            - field: years_experience
              operator: gte
              weight: 15
              value: 4
              label: 经验年限

  - name: 市场部
    supervisor:
      name: 王强
      title: 王总
      feishu_open_id: ou_mock_wangqiang
      email: wangqiang@xingye-test.com
    positions:
      - code: marketing_specialist
        title: 市场运营专员
        headcount: 1
        description: >-
          负责内容运营、活动策划与投放效果优化，要求有社群或新媒体运营经验，
          能用数据评估投放 ROI。
        keywords: [市场, 运营, 内容运营, 活动策划, 新媒体, 投放]
        screening:
          threshold: 45
          rule_version: v1
          hard_conditions:
            - field: education_level
              operator: gte
              value: 大专
              label: 大专及以上学历
            - field: years_experience
              operator: gte
              value: 1
              label: 1 年以上市场/运营经验
          weighted:
            - field: skills
              operator: contains_any
              weight: 50
              value: [内容运营, 活动策划, 社群, 投放, SEO, 短视频, 数据分析, 新媒体, 增长]
              label: 运营技能匹配度
            - field: project_highlights
              operator: contains_any
              weight: 30
              value: [涨粉, 转化, GMV, 曝光, ROI, 复购, 拉新]
              label: 成果量化程度
            - field: major
              operator: contains_any
              weight: 20
              value: [市场, 新闻, 传播, 中文, 广告, 管理]
              label: 专业相关性
