[project]
name = "ai-hr-robot"
version = "0.1.0"
description = "AI 招聘机器人：收简历 → 筛选 → 分发 → 飞书/邮件反馈 → 面试通知"
# 3.14 暂时不用：项目依赖的部分二进制包（greenlet / pydantic-core）还没有稳定的 cp314 轮子
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "apscheduler>=3.11,<4",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "lark-oapi>=1.7.5",
    "litellm>=1.50",
]

[project.optional-dependencies]
# 扫描件 / 复杂分栏 PDF 的兜底解析器。装它会连带 torch，体积约 2GB；
# 不装也能跑：client/resume_parser.py 会降级到 pypdf / python-docx。
ocr = ["unstructured[pdf,docx]>=0.14"]

# 开发依赖放 dev 组：uv sync 默认就装，生产用 --no-dev 跳过
[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.uv]
# 本项目是「应用」不是「库」：uv 只需要装依赖，不要尝试把仓库打成 wheel
package = false
# 国内直连 pypi.org 经常卡住，走清华镜像；换源只改这一处
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
