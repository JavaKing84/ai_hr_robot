# Alembic migration config (async SQLAlchemy + PostgreSQL)
#
# Usage:
#   .venv\Scripts\python.exe -m alembic revision --autogenerate -m "message"
#   .venv\Scripts\python.exe -m alembic upgrade head
#   .venv\Scripts\python.exe -m alembic current
#
# The database URL is NOT read from this file (left empty); it is injected at
# runtime by migrations/env.py from config/settings.py (DATABASE_URL), so test
# and production always share the same source of truth.

[alembic]
script_location = migrations
prepend_sys_path = .
version_locations = migrations/versions

# async engine uses asyncpg; sqlalchemy.url is injected in env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
