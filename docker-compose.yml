name: hr-ai-robot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: hr_robot
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_robot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgresql+asyncpg://hr:hr@postgres:5432/hr_robot
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      # 飞书
      FEISHU_MODE: ${FEISHU_MODE:-mock}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      # LLM
      LLM_MODE: ${LLM_MODE:-auto}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # 邮件
      MAIL_MODE: ${MAIL_MODE:-mock}
      HR_MAILBOX: ${HR_MAILBOX:-hr@example.com}
      HR_SENDER_NAME: ${HR_SENDER_NAME:-星野科技 HR}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      # 调度
      SCHEDULER_ENABLED: "true"
      SCHEDULE_CRON: ${SCHEDULE_CRON:-0 9 * * *}
      INBOUND_POLL_SECONDS: ${INBOUND_POLL_SECONDS:-300}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
